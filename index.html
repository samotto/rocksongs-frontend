<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam's Rock Song Catalog</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===== PAGE HEADER / BANNER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <h1>🎸 Sam's Rock Song Catalog</h1>
      <nav class="account-nav" aria-label="Account controls">
        <button id="userAdminBtn" class="icon-btn" type="button" title="User Administration" aria-label="User Administration" style="display:none;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3ZM8 11c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13Zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5Z"/></svg>
        </button>
        <button id="userSettingsBtn" class="icon-btn" type="button" title="User Settings" aria-label="User Settings" style="display:none;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.08-.98l2.11-1.65-2-3.46-2.49 1a7.48 7.48 0 0 0-1.69-.98L15 3.27h-4l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1-2 3.46 2.11 1.65c-.04.33-.08.66-.08.99s.03.66.08.98l-2.11 1.65 2 3.46 2.49-1c.52.4 1.08.73 1.69.98l.38 2.66h4l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1 2-3.46-2.13-1.66ZM13 15.5A3.5 3.5 0 1 1 13 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
        </button>
        <button id="authIconBtn" class="icon-btn" type="button" title="Log out" aria-label="Log out">
          <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17v-2H3V9h7V7l5 5-5 5Zm9-14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-2h2v2h8V5h-8v2H9V5a2 2 0 0 1 2-2h8Z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN CONTAINER ===== -->
  <main class="container" id="catalogView">

    <!-- Action row: search left, auth/add right -->
    <div class="action-row">
      <div class="search-area">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search by artist or song..."
          autocomplete="off"
        />
      </div>
      <div class="action-buttons">
        <span id="apiModeBadge" class="api-mode-badge" title="Current API mode">API: --</span>
        <!-- + button: only shown when logged in -->
        <button id="addSongBtn" class="btn btn-primary" style="display:none;" title="Add new song">
          + New Song
        </button>
      </div>
    </div>

    <!-- Song count summary -->
    <div class="result-summary">
      <span id="resultSummary"></span>
    </div>

    <!-- ===== SONG TABLE ===== -->
    <div class="table-wrapper">
      <table class="song-table" id="songTable">
        <thead>
          <tr>
            <th id="thArtist" data-sort-key="artist" aria-sort="ascending">Artist <span class="sort-indicator" aria-hidden="true">▲</span></th>
            <th id="thSong" data-sort-key="song" aria-sort="none">Song <span class="sort-indicator" aria-hidden="true">↕</span></th>
            <th id="thAlbum" data-sort-key="album" aria-sort="none">Album <span class="sort-indicator" aria-hidden="true">↕</span></th>
          </tr>
        </thead>
        <tbody id="songTableBody">
          <!-- Rows injected by app.js -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        No songs match your search.
      </div>
    </div>

    <!-- ===== PAGINATION ===== -->
    <nav class="pagination" id="pagination" aria-label="Song pagination">
      <!-- Injected by app.js -->
    </nav>

  </main>

  <main class="container" id="userAdminView" style="display:none;">
    <div class="view-heading">
      <div>
        <p class="eyebrow">Administration</p>
        <h2>User Administration</h2>
        <p class="view-subtitle">Manage access and roles for Rock Song Catalog users.</p>
      </div>
      <button id="backToCatalogBtn" class="btn btn-secondary" type="button">← Back to catalog</button>
    </div>
    <div class="table-wrapper">
      <table class="song-table user-table">
        <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last login</th></tr></thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </main>

  <!-- ===== MODAL DIALOG ===== -->
  <div id="modalOverlay" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Song</h2>
        <button class="modal-close-x" id="modalCloseX" aria-label="Close">&times;</button>
      </div>

      <form id="songForm" novalidate>
        <!-- Hidden id field -->
        <input type="hidden" id="fieldId" />

        <div class="form-group">
          <label for="fieldArtist">Artist</label>
          <input type="text" id="fieldArtist" placeholder="e.g. Led Zeppelin" required />
        </div>

        <div class="form-group">
          <label for="fieldSong">Song</label>
          <input type="text" id="fieldSong" placeholder="e.g. Stairway to Heaven" required />
        </div>

        <div class="form-group">
          <label for="fieldAlbum">Album</label>
          <input type="text" id="fieldAlbum" placeholder="e.g. Led Zeppelin IV" />
        </div>

        <div class="form-group form-group--checkbox">
          <label>
            <input type="checkbox" id="fieldOverplayed" />
            Overplayed
          </label>
        </div>

        <!-- Modal action buttons -->
        <div class="modal-footer">
          <!-- Update / Delete: only shown when logged in -->
          <button type="button" id="modalSaveBtn"   class="btn btn-primary"   style="display:none;">Save</button>
          <button type="button" id="modalDeleteBtn" class="btn btn-danger"    style="display:none;">Delete</button>
          <button type="button" id="modalCloseBtn"  class="btn btn-secondary">Close</button>
        </div>
      </form>
    </div>
  </div>

  <div id="userModalOverlay" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
    <div class="modal-box user-modal-box">
      <div class="modal-header">
        <h2 id="userModalTitle">User Information</h2>
        <button class="modal-close-x" id="userModalCloseX" aria-label="Close">&times;</button>
      </div>
      <form id="userForm" class="modal-form" novalidate>
        <input type="hidden" id="userFieldId" />
        <div class="user-identity">
          <span id="userInitials" class="user-avatar"></span>
          <div><strong id="userDisplayName"></strong><span id="userEmailDisplay"></span></div>
        </div>
        <div class="form-group"><label for="userFieldName">Name</label><input type="text" id="userFieldName" required /></div>
        <div class="form-group"><label for="userFieldEmail">Email</label><input type="email" id="userFieldEmail" required /></div>
        <div class="form-group"><label for="userFieldRole">Role</label><select id="userFieldRole"><option value="Basic">Basic</option><option value="Admin">Admin</option></select></div>
        <div id="passwordResetStatus" class="inline-status" aria-live="polite"></div>
        <div class="modal-footer split-footer">
          <button type="button" id="resetPasswordBtn" class="btn btn-secondary">Reset password</button>
          <div><button type="button" id="userModalCancelBtn" class="btn btn-secondary">Cancel</button> <button type="button" id="userModalSaveBtn" class="btn btn-primary">Save changes</button></div>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== DELETE CONFIRM DIALOG ===== -->
  <div
    id="deleteConfirmOverlay"
    class="modal-overlay"
    style="display:none;"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deleteConfirmTitle"
    aria-describedby="deleteConfirmText"
  >
    <div class="confirm-box">
      <div class="confirm-header">
        <h3 id="deleteConfirmTitle">Delete Song?</h3>
      </div>
      <div class="confirm-body">
        <p id="deleteConfirmText">This action cannot be undone.</p>
      </div>
      <div class="confirm-footer">
        <button type="button" id="deleteConfirmCancelBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="deleteConfirmOkBtn" class="btn btn-danger">Delete Forever</button>
      </div>
    </div>
  </div>

  <!-- Runtime config for static hosting (GitHub Pages) + Railway backend -->
  <script>
    window.RockSongsConfig = {
      API_BASE_URL: "https://your-railway-backend-url",
      USE_MOCK_API: true
    };
  </script>

  <!-- Scripts: api.js must load before app.js -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
