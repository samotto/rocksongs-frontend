<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam's Rock Song Catalog</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===== PAGE HEADER / BANNER ===== -->
  <header class="site-header">
    <h1>🎸 Sam's Rock Song Catalog</h1>
  </header>

  <!-- ===== MAIN CONTAINER ===== -->
  <main class="container">

    <!-- Action row: search left, auth/add right -->
    <div class="action-row">
      <div class="search-area">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search by artist or song..."
          autocomplete="off"
        />
      </div>
      <div class="action-buttons">
        <span id="apiModeBadge" class="api-mode-badge" title="Current API mode">API: --</span>
        <!-- + button: only shown when logged in -->
        <button id="addSongBtn" class="btn btn-primary" style="display:none;" title="Add new song">
          + New Song
        </button>
        <!-- Login / Logout toggle -->
        <button id="loginBtn"  class="btn btn-secondary">Login</button>
        <button id="logoutBtn" class="btn btn-secondary" style="display:none;">Logout</button>
      </div>
    </div>

    <!-- Song count summary -->
    <div class="result-summary">
      <span id="resultSummary"></span>
    </div>

    <!-- ===== SONG TABLE ===== -->
    <div class="table-wrapper">
      <table class="song-table" id="songTable">
        <thead>
          <tr>
            <th id="thArtist" data-sort-key="artist" aria-sort="ascending">Artist <span class="sort-indicator" aria-hidden="true">▲</span></th>
            <th id="thSong" data-sort-key="song" aria-sort="none">Song <span class="sort-indicator" aria-hidden="true">↕</span></th>
            <th id="thAlbum" data-sort-key="album" aria-sort="none">Album <span class="sort-indicator" aria-hidden="true">↕</span></th>
          </tr>
        </thead>
        <tbody id="songTableBody">
          <!-- Rows injected by app.js -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        No songs match your search.
      </div>
    </div>

    <!-- ===== PAGINATION ===== -->
    <nav class="pagination" id="pagination" aria-label="Song pagination">
      <!-- Injected by app.js -->
    </nav>

  </main>

  <!-- ===== MODAL DIALOG ===== -->
  <div id="modalOverlay" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Song</h2>
        <button class="modal-close-x" id="modalCloseX" aria-label="Close">&times;</button>
      </div>

      <form id="songForm" novalidate>
        <!-- Hidden id field -->
        <input type="hidden" id="fieldId" />

        <div class="form-group">
          <label for="fieldArtist">Artist</label>
          <input type="text" id="fieldArtist" placeholder="e.g. Led Zeppelin" required />
        </div>

        <div class="form-group">
          <label for="fieldSong">Song</label>
          <input type="text" id="fieldSong" placeholder="e.g. Stairway to Heaven" required />
        </div>

        <div class="form-group">
          <label for="fieldAlbum">Album</label>
          <input type="text" id="fieldAlbum" placeholder="e.g. Led Zeppelin IV" />
        </div>

        <div class="form-group form-group--checkbox">
          <label>
            <input type="checkbox" id="fieldOverplayed" />
            Overplayed
          </label>
        </div>

        <!-- Modal action buttons -->
        <div class="modal-footer">
          <!-- Update / Delete: only shown when logged in -->
          <button type="button" id="modalSaveBtn"   class="btn btn-primary"   style="display:none;">Save</button>
          <button type="button" id="modalDeleteBtn" class="btn btn-danger"    style="display:none;">Delete</button>
          <button type="button" id="modalCloseBtn"  class="btn btn-secondary">Close</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== DELETE CONFIRM DIALOG ===== -->
  <div
    id="deleteConfirmOverlay"
    class="modal-overlay"
    style="display:none;"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deleteConfirmTitle"
    aria-describedby="deleteConfirmText"
  >
    <div class="confirm-box">
      <div class="confirm-header">
        <h3 id="deleteConfirmTitle">Delete Song?</h3>
      </div>
      <div class="confirm-body">
        <p id="deleteConfirmText">This action cannot be undone.</p>
      </div>
      <div class="confirm-footer">
        <button type="button" id="deleteConfirmCancelBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="deleteConfirmOkBtn" class="btn btn-danger">Delete Forever</button>
      </div>
    </div>
  </div>

  <!-- Runtime config for static hosting (GitHub Pages) + Railway backend -->
  <script>
    window.RockSongsConfig = {
      API_BASE_URL: "https://your-railway-backend-url",
      USE_MOCK_API: true
    };
  </script>

  <!-- Scripts: api.js must load before app.js -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
